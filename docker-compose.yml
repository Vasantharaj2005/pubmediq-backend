version: "3.9"

services:
  # ============================================================
  # FastAPI Application
  # ============================================================
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: pubmediq-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://pubmediq:pubmediq@postgres:5432/pubmediq
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../app:/app/app  # hot reload in dev
    restart: unless-stopped
    networks:
      - pubmediq-net

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: pubmediq-postgres
    environment:
      POSTGRES_DB: pubmediq
      POSTGRES_USER: pubmediq
      POSTGRES_PASSWORD: pubmediq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubmediq -d pubmediq"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pubmediq-net

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: pubmediq-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pubmediq-net

volumes:
  postgres_data:
  redis_data:

networks:
  pubmediq-net:
    driver: bridge
