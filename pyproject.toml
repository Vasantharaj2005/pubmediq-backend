[project]
name = "pubmediq-backend"
version = "0.1.0"
description = "PubMedIQ — AI-powered semantic research assistant on top of PubMed"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PubMedIQ Team" }]
license = { text = "MIT" }

dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401", "B008"]
exclude = ["alembic", ".git", "__pycache__", ".venv"]

[tool.ruff.per-file-ignores]
"tests/**" = ["ANN", "S"]
"scripts/**" = ["ANN", "T201"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/infrastructure/database/migrations/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
