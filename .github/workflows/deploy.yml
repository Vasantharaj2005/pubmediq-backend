name: PubMedIQ AWS CI/CD

on:
  push:
    branches:
      - prod
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: pubmediq-backend-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-prod.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/

  push_to_ecr:
    name: Build and Push ECR Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim Docker build space
        run: |
          docker builder prune --all --force || true
          docker image prune --all --force || true
          docker system df || true
          minimum_free_kb=12582912
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          if [ "$available_kb" -lt "$minimum_free_kb" ]; then
            echo "::error::Only $((available_kb / 1024 / 1024)) GiB is free; 12 GiB is required to build the image."
            df -h "$GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Validate ECR settings
        run: |
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "Building and pushing ${image_uri}"
          docker buildx build \
            --file ./Dockerfile \
            --push \
            --tag "${image_uri}:main" \
            --tag "${image_uri}:sha-${{ github.sha }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=min \
            .

  continuous_deployment:
    name: Deploy to AWS EC2
    needs: push_to_ecr
    runs-on: self-hosted
    env:
      # Use repository variable (non‑sensitive) instead of secret
      DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Reclaim unused Docker resources
        run: |
          docker container prune --force
          docker image prune --all --force
          docker builder prune --all --force
          docker system df

      # ─── DEBUG STEP: Show the value of DEPLOY_DIRECTORY ───
      - name: Debug DEPLOY_DIRECTORY
        run: |
          echo "DEPLOY_DIRECTORY = '${DEPLOY_DIRECTORY}'"
          if [ -z "$DEPLOY_DIRECTORY" ]; then
            echo "❌ DEPLOY_DIRECTORY is empty!"
            exit 1
          else
            echo "✅ DEPLOY_DIRECTORY is set."
          fi

      - name: Validate EC2 deployment directory
        run: |
          test -f "$DEPLOY_DIRECTORY/docker-compose.yml"
          test -f "$DEPLOY_DIRECTORY/.env"

      - name: Deploy FastAPI app
        working-directory: ${{ env.DEPLOY_DIRECTORY }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "Pulling ${image_uri}:main"
          docker pull "${image_uri}:main"
          export APP_IMAGE="${image_uri}:main"
          docker compose up -d postgres redis
          docker compose up -d --no-deps --force-recreate app

      - name: Verify container is running
        run: |
          sleep 10
          if ! docker ps --filter "name=pubmediq-app" --filter "status=running" | grep -q "pubmediq-app"; then
            echo "The FastAPI container failed to start."
            docker logs pubmediq-app || true
            exit 1
          fi

      - name: Verify FastAPI health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if curl -s http://localhost:8000/api/v1/health | grep -q "status"; then
              echo "FastAPI is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "FastAPI did not become healthy."
          docker logs --tail 100 pubmediq-app || true
          exit 1

      - name: Remove unused Docker resources
        if: always()
        run: |
          docker image prune --all --force
          docker builder prune --all --force