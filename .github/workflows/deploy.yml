name: PubMedIQ AWS CI/CD

on:
  push:
    branches:
      - prod
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: pubmediq-backend-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: pubmediq-backend

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/

  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim Docker build space
        run: |
          docker builder prune --all --force || true
          docker image prune --all --force || true
          docker system df || true

          minimum_free_kb=12582912
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          if [ "$available_kb" -lt "$minimum_free_kb" ]; then
            echo "::error::Only $((available_kb / 1024 / 1024)) GiB is free; 12 GiB is required to build the image."
            df -h "$GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
          REPO="${USERNAME}/${{ env.IMAGE_NAME }}"
          echo "Building and pushing to $REPO"

          # FIX: removed --context, using . as context at the end
          docker buildx build \
            --file ./Dockerfile \
            --push \
            --tag "$REPO:main" \
            --tag "$REPO:sha-${{ github.sha }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=min \
            .

  continuous_deployment:
    name: Deploy to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted  # <-- make sure you have a self-hosted runner on EC2

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Reclaim unused Docker resources
        run: |
          docker container prune --force
          docker image prune --all --force
          docker builder prune --all --force
          docker system df

      - name: Deploy FastAPI App
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '[:space:]')
          IMAGE_PATH="${USERNAME}/${{ env.IMAGE_NAME }}"

          echo "Pulling $IMAGE_PATH:main"
          docker pull "$IMAGE_PATH:main"

          # Ensure postgres and redis are running first (if not already)
          docker-compose up -d postgres redis

          # Override the app image tag and restart app only
          export APP_IMAGE="${IMAGE_PATH}:main"
          docker-compose up -d --no-deps --force-recreate app

      - name: Verify container is running
        run: |
          sleep 10
          if ! docker ps --filter "name=pubmediq-app" --filter "status=running" | grep -q "pubmediq-app"; then
            echo "The FastAPI container failed to start."
            docker logs pubmediq-app || true
            exit 1
          fi
          echo "The FastAPI container is running."

      - name: Verify FastAPI health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if curl -s http://localhost:8000/api/v1/health | grep -q "status"; then
              echo "FastAPI application is healthy."
              exit 0
            fi
            echo "Waiting for FastAPI to become ready..."
            sleep 5
          done
          echo "FastAPI did not become healthy."
          docker logs --tail 100 pubmediq-app || true
          exit 1

      - name: Remove unused Docker images
        if: always()
        run: |
          docker image prune --all --force
          docker builder prune --all --force
