name: PubMedIQ AWS CI/CD

on:
  push:
    branches:
      - prod
    paths-ignore:
      - "README.md"

  # Allows you to run the workflow manually
  workflow_dispatch:

# Prevent two deployments from running at the same time
concurrency:
  group: pubmediq-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/

  # ============================================================
  # 2. BUILD AND PUSH IMAGE TO DOCKER HUB
  # ============================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker image settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$IMAGE_NAME" ]; then
            echo "IMAGE_NAME secret is missing."
            exit 1
          fi

          echo "Docker image settings are configured."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 3. DEPLOY TO AWS EC2 SELF-HOSTED RUNNER
  # ============================================================
  continuous_deployment:
    name: Deploy to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate application secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$PINECONE_API_KEY" ]; then
            echo "PINECONE_API_KEY secret is missing."
            exit 1
          fi
          
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret is missing."
            exit 1
          fi
          
          echo "All required application secrets are configured."

      - name: Pull latest Docker image
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: |
          docker pull "${IMAGE_PATH}:main"

      - name: Deploy FastAPI App
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
          
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        run: |
          # Ensure postgres and redis are running first
          docker-compose up -d postgres redis
          
          # Overwrite the app image tag to the pulled main image dynamically
          export APP_IMAGE="${IMAGE_PATH}:main"
          
          # Recreate only the FastAPI app container with zero DB downtime
          docker-compose up -d --no-deps --force-recreate app

      - name: Verify container is running
        run: |
          sleep 10
          if ! docker ps --filter "name=pubmediq-app" --filter "status=running" | grep -q "pubmediq-app"; then
            echo "The FastAPI container failed to start."
            docker logs pubmediq-app || true
            exit 1
          fi
          echo "The FastAPI container is running."

      - name: Verify FastAPI health endpoint
        run: |
          for attempt in $(seq 1 12); do
            # Using curl to hit the local FastAPI health endpoint
            if curl -s http://localhost:8000/api/v1/health | grep -q "status"; then
              echo "FastAPI application is healthy."
              exit 0
            fi

            echo "Waiting for FastAPI to become ready..."
            sleep 5
          done

          echo "FastAPI did not become healthy."
          docker logs --tail 100 pubmediq-app || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 pubmediq-app 2>/dev/null || true

      - name: Remove unused Docker images
        if: always()
        run: |
          docker image prune -f
